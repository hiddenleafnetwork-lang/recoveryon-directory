<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | RecoveryOn</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Styles -->
    <link rel="stylesheet" href="dashboard.css">
    <style>
        body {
            background-color: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: var(--font-sans);
        }
        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            text-align: center;
        }
        .login-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 28px;
        }
        .login-logo .logo-icon {
            background-color: var(--bg-light-blue);
            color: var(--primary-color);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        .login-logo .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
        }
        .login-logo .logo-text span {
            color: var(--primary-color);
        }
        .login-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            margin: 0 0 8px 0;
        }
        .login-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 0 0 32px 0;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--text-body);
            background-color: var(--bg-card);
            outline: none;
            transition: all var(--transition-fast);
        }
        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(2, 128, 144, 0.1);
        }
        .btn-login {
            width: 100%;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-login:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .error-message {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #ef4444;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-align: left;
            display: none;
            align-items: flex-start;
            gap: 8px;
        }
        .error-message i {
            margin-top: 2px;
        }
        .setup-notice {
            margin-top: 28px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            border-top: 1px dashed var(--border-color);
            padding-top: 18px;
        }
        .setup-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
        }
        .setup-link:hover {
            text-decoration: underline;
        }
    </style>
    <script src="../supabase-config.js"></script>
</head>
<body>
    <div class="login-card">
        <a href="../index.html" class="login-logo">
            <span class="logo-icon"><i class="fa-solid fa-circle-nodes"></i></span>
            <span class="logo-text">Recovery<span>On</span></span>
        </a>
        <h1 class="login-title">Internal Admin Dashboard</h1>
        <p class="login-subtitle">Please enter your credentials to log in.</p>

        <!-- Error box -->
        <div class="error-message" id="error-box">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="error-text">Incorrect email or password.</span>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="login-email">Email Address</label>
                <input class="form-input" type="email" id="login-email" required placeholder="admin@recoveryon.org">
            </div>
            <div class="form-group" style="margin-bottom: 28px;">
                <label class="form-label" for="login-password">Password</label>
                <input class="form-input" type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login" id="btn-submit">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="setup-notice">
            Missing Database Configuration? <a href="#" class="setup-link" id="setup-trigger">Configure URL & Key</a>
        </div>
    </div>

    <!-- Configure Supabase Credentials Modal (For local development/setup) -->
    <div id="setup-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(15, 23, 42, 0.6); display:none; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; z-index:9999;">
        <div class="login-card" style="position:relative; max-width: 480px; padding: 32px;">
            <button id="setup-close" style="position:absolute; top:20px; right:20px; background:none; border:none; font-size:1.25rem; color:var(--text-muted); cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="login-title" style="text-align:left; margin-bottom:4px;">Supabase Database Connection</h2>
            <p class="login-subtitle" style="text-align:left; margin-bottom:24px;">Configure the client connection settings. These keys will be securely saved in your browser local storage.</p>
            
            <form id="setup-form">
                <div class="form-group">
                    <label class="form-label">Supabase URL</label>
                    <input class="form-input" type="url" id="setup-url" required placeholder="https://xxxxxxxx.supabase.co">
                </div>
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label">Supabase Anonymous Key</label>
                    <input class="form-input" type="text" id="setup-key" required placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
                </div>
                <button type="submit" class="btn-login" style="margin-top:0;">Save Connection Settings</button>
            </form>
        </div>
    </div>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('login-form');
            const setupForm = document.getElementById('setup-form');
            const setupModal = document.getElementById('setup-modal');
            const setupTrigger = document.getElementById('setup-trigger');
            const setupClose = document.getElementById('setup-close');
            const errorBox = document.getElementById('error-box');
            const errorText = document.getElementById('error-text');

            // Load saved settings if any
            const savedUrl = localStorage.getItem('RECOVERYON_SUPABASE_URL') || '';
            const savedKey = localStorage.getItem('RECOVERYON_SUPABASE_KEY') || '';
            document.getElementById('setup-url').value = savedUrl;
            document.getElementById('setup-key').value = savedKey;

            // Setup modal handlers
            setupTrigger.addEventListener('click', (e) => {
                e.preventDefault();
                setupModal.style.display = 'flex';
            });
            setupClose.addEventListener('click', () => {
                setupModal.style.display = 'none';
            });
            setupForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const url = document.getElementById('setup-url').value.trim();
                const key = document.getElementById('setup-key').value.trim();
                localStorage.setItem('RECOVERYON_SUPABASE_URL', url);
                localStorage.setItem('RECOVERYON_SUPABASE_KEY', key);
                setupModal.style.display = 'none';
                alert('Connection settings saved. You can now log in.');
            });

            // Login submission handler
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBox.style.display = 'none';
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;

                const config = window.RECOVERYON_CONFIG || {};
                const url = config.SUPABASE_URL || localStorage.getItem('RECOVERYON_SUPABASE_URL');
                const key = config.SUPABASE_KEY || localStorage.getItem('RECOVERYON_SUPABASE_KEY');

                if (!url || !key) {
                    errorText.textContent = "Supabase Connection is not configured. Please fill in supabase-config.js in the project root folder.";
                    errorBox.style.display = 'flex';
                    return;
                }

                try {
                    const supabase = window.supabase.createClient(url, key);
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    
                    if (error) {
                        errorText.textContent = error.message;
                        errorBox.style.display = 'flex';
                        return;
                    }

                    // Successful login: redirect to dashboard index
                    window.location.href = 'index.html';
                } catch (err) {
                    errorText.textContent = "Unable to connect to Supabase: " + err.message;
                    errorBox.style.display = 'flex';
                }
            });
        });
    </script>
</body>
</html>
